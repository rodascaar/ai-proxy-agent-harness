# Configuración de golangci-lint para el proxy de descomposición atómica.
version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - revive
    - errcheck
    - ineffassign
    - staticcheck
    - unused
    - govet
    - inamedparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: false

formatters:
  enable:
    - gofmt
    - goimports